name: CI

on:
  push:
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Given to you. Do not delete this job.
  # ---------------------------------------------------------------------------
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run hygiene checks
        run: bash scripts/hygiene.sh

  # ---------------------------------------------------------------------------
   #M3 — YOUR WORK STARTS HERE.
  
  # Uncomment the job below and make it pass. Fill in the Makefile targets for
   #your stack; do not change the target names, because this file calls them.
  
  # The pipeline must genuinely fail when your tests fail. Do not add
  # continue-on-error or "|| true" to make it green.
  # ---------------------------------------------------------------------------

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
  
      # Set up whichever runtime you need, for example:
      # - uses: actions/setup-node@v4
      #   with: { node-version: '20', cache: 'npm' }
      # - uses: actions/setup-python@v5
      #   with: { python-version: '3.12' }
  
      - run: make install
      - run: make test
      - run: make build

  # ---------------------------------------------------------------------------
  docker:
    name: Build and push images
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo name
        id: repo_name
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.repo_name.outputs.repo }}:latest
  #---------------------------------------------------------------------------
  # M5 — Deployment. Add a deploy job here.
  #---------------------------------------------------------------------------
